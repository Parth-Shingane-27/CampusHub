<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | CampusHub</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ============ NAVBAR ============ -->
  <header>
    <nav class="navbar">
      <div class="container">
        <a href="index.html" class="logo">
          <span class="logo-badge">CH</span>
          Campus<span>Hub</span>
        </a>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="events.html">Events</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="login.html" class="active">Login</a></li>
        </ul>
        <div class="nav-cta">
          <a href="login.html" class="btn btn-primary btn-small">Sign in with Google</a>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <!-- ============ LOGIN FORM SECTION ============ -->
    <section class="auth-section">
      <div class="auth-card">
        <a href="index.html" class="logo">
          <span class="logo-badge">CH</span>
          Campus<span>Hub</span>
        </a>
        <div class="auth-header">
          <h1>Welcome Back</h1>
          <p>Sign in with your @mitaoe.ac.in Google account to register for events.</p>
        </div>

        <!-- Students: Google sign-in only -->
        <div id="google-signin" style="display:flex;justify-content:center;margin:8px 0 18px;"></div>
        <p class="form-message" id="login-message" role="status" aria-live="polite"></p>

        <p style="text-align:center;margin:12px 0;">
          <a href="#" id="admin-toggle" class="forgot-link">Admin login</a>
        </p>

        <!-- Admin only: password login (students are rejected by the server) -->
        <form id="login-form" action="#" novalidate style="display:none;">
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="you@mitaoe.ac.in" required>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="login-submit-btn">Admin Login</button>
        </form>
      </div>
    </section>
  </main>

  <!-- ============ FOOTER ============ -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 CampusHub. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script src="js/navbar.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="js/login.js"></script>
</body>
</html>
